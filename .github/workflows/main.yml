name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  HUGO_ENV: production
  HUGO_VERSION: "0.151.0"
  GO_VERSION: "1.23.3"
  TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
  TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
  TINA_SEARCH_TOKEN: ${{ secrets.TINA_SEARCH_TOKEN }}

jobs:
  build:
    # ✅ Use AMD64 runner (supported for private repos)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Detect and install Hugo for correct architecture
      - name: Install Hugo
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            HUGO_ARCH="arm64"
          else
            HUGO_ARCH="amd64"
          fi
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-${HUGO_ARCH}.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # Install Go (for Hugo modules)
      - name: Install Go
        run: |
          wget -O ${{ runner.temp }}/go.tar.gz https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf ${{ runner.temp }}/go.tar.gz

      # Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Setup project
        run: npm run project-setup

      - name: Install dependencies
        run: npm ci

      - name: Build Hugo site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to public repo using PAT
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}   # ✅ Your fine-grained PAT
          external_repository: coldsteam-studio/coldsteam-studio  # ✅ Public repo
          publish_dir: ./public
          publish_branch: main                         # or gh-pages
          commit_message: "Deploy Hugo site: ${{ github.sha }}"
          cname: "www.example.com"                      # optional custom domain
